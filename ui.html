<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParDL — دانلود موازی</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ac:#4ade80;--err:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Vazirmatn,system-ui,sans-serif}
main{max-width:720px;margin:32px auto;padding:0 16px}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--mut);margin-bottom:20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 6px}
textarea,input[type=text],select{width:100%;background:#0f1115;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;direction:ltr;text-align:left}
textarea{height:84px;resize:vertical}
input[type=range]{width:100%;direction:ltr}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0;color:var(--tx);direction:ltr;justify-content:flex-end}
button{background:var(--ac);color:#06220f;border:0;border-radius:8px;padding:11px 22px;font:inherit;font-weight:bold;cursor:pointer}
button.sec{background:#2a2f3a;color:var(--tx)}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:14px;background:#0f1115;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
.bar>div{height:100%;width:0;background:var(--ac);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-size:18px;direction:ltr}
.stats span{font-size:12px;color:var(--mut)}
.msg{font-size:13px;margin-top:8px;word-break:break-all}
.err{color:var(--err)}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>⚡ ParDL</h1>
<div class="sub">دانلود موازی: فایل تکه‌تکه می‌شود، همه تکه‌ها هم‌زمان از چند اتصال (و در صورت امکان چند شبکه / میرور) گرفته می‌شوند و مرتب کنار هم چیده می‌شوند.</div>

<div class="card">
  <label>لینک دانلود (اگر چند آدرس از <u>همان فایل</u> داری، هر کدام در یک خط → به‌عنوان میرور استفاده می‌شوند)</label>
  <textarea id="urls" placeholder="https://example.com/file.zip"></textarea>
  <div class="row">
    <div>
      <label>اتصال هم‌زمان: <b id="nv">16</b></label>
      <input type="range" id="conns" min="1" max="64" value="16">
    </div>
    <div>
      <label>اندازه هر تکه</label>
      <select id="chunk">
        <option value="1">1 MB</option>
        <option value="2" selected>2 MB</option>
        <option value="4">4 MB</option>
        <option value="8">8 MB</option>
        <option value="16">16 MB</option>
      </select>
    </div>
  </div>
  <label>پوشه ذخیره (خالی = پوشه Downloads)</label>
  <input type="text" id="dir" placeholder="C:\Users\...\Downloads">
  <div id="ifbox" style="display:none">
    <label>شبکه‌های فعال (چند مورد انتخاب کنی، اتصال‌ها بینشان پخش می‌شوند و سرعت‌ها جمع می‌شود)</label>
    <div id="ifs"></div>
  </div>
  <div style="margin-top:14px;display:flex;gap:10px">
    <button id="go">شروع دانلود</button>
    <button id="stop" class="sec" disabled>لغو</button>
  </div>
  <div class="hint">لغو یا قطع شدن = دانلود نیمه‌کاره می‌ماند؛ با شروع مجدد همان لینک، از جای قبلی ادامه می‌دهد.</div>
</div>

<div class="card">
  <div id="state" style="font-weight:bold">آماده</div>
  <div class="bar"><div id="fill"></div></div>
  <div class="stats">
    <div><b id="spd">—</b><span>سرعت فعلی</span></div>
    <div><b id="avg">—</b><span>میانگین</span></div>
    <div><b id="eta">—</b><span>زمان باقی‌مانده</span></div>
  </div>
  <div class="msg" id="info"></div>
  <div class="msg err" id="err"></div>
</div>
</main>
<script>
const TOKEN="__TOKEN__";
const $=id=>document.getElementById(id);
const api=(p,o={})=>fetch(p,{...o,headers:{"X-Token":TOKEN,"Content-Type":"application/json"}}).then(r=>r.json());
const fmtB=n=>{if(n<1024)return n.toFixed(0)+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";if(n<1073741824)return (n/1048576).toFixed(1)+" MB";return (n/1073741824).toFixed(2)+" GB"};
const fmtT=s=>{if(!isFinite(s)||s<=0)return "—";s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")};
$("conns").oninput=e=>$("nv").textContent=e.target.value;

api("/api/ifaces").then(list=>{
  if(!list||list.length<2)return;
  $("ifbox").style.display="block";
  $("ifs").innerHTML=list.map(i=>`<label class="chk"><span>${i.name} — ${i.ip}</span><input type="checkbox" class="ifc" value="${i.ip}"></label>`).join("");
});

$("go").onclick=async()=>{
  $("err").textContent="";
  const cfg={
    urls:$("urls").value.split("\n"),
    dir:$("dir").value.trim(),
    conns:+$("conns").value,
    chunkMB:+$("chunk").value,
    ifaces:[...document.querySelectorAll(".ifc:checked")].map(x=>x.value)
  };
  const r=await api("/api/start",{method:"POST",body:JSON.stringify(cfg)});
  if(r.error)$("err").textContent=r.error;
};
$("stop").onclick=()=>api("/api/cancel",{method:"POST"});

const names={idle:"آماده",probing:"در حال بررسی لینک…",downloading:"در حال دانلود",done:"✅ دانلود کامل شد",error:"❌ خطا",cancelled:"متوقف شد (قابل ادامه)"};
async function poll(){
  try{
    const s=await api("/api/status");
    const active=s.state==="probing"||s.state==="downloading";
    $("go").disabled=active;$("stop").disabled=!active;
    $("state").textContent=names[s.state]||s.state;
    const pct=s.size>0?Math.min(100,s.done/s.size*100):0;
    $("fill").style.width=(s.state==="done"?100:pct)+"%";
    $("spd").textContent=active?fmtB(s.speed)+"/s":"—";
    $("avg").textContent=s.avg>0?fmtB(s.avg)+"/s":"—";
    $("eta").textContent=active?fmtT(s.eta):"—";
    let info="";
    if(s.file){
      info=`${s.file} — ${fmtB(s.done)}${s.size>0?" / "+fmtB(s.size)+" ("+pct.toFixed(1)+"%)":""}`;
      info+=s.rangeOK?` — ${s.workers} اتصال موازی`+(s.mirrors>1?` روی ${s.mirrors} میرور`:""):" — ⚠️ این سرور دانلود تکه‌ای را پشتیبانی نمی‌کند (تک‌اتصالی)";
      if(s.state==="done")info+="\n"+s.path;
    }
    $("info").textContent=info;$("info").style.whiteSpace="pre-line";
    $("err").textContent=s.err||"";
  }catch(e){}
  setTimeout(poll,500);
}
poll();
</script>
</body>
</html>
