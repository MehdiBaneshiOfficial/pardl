<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParDL — داشبورد</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ac:#4ade80;--err:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Vazirmatn,system-ui,sans-serif}
main{max-width:860px;margin:28px auto;padding:0 16px}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--mut);margin-bottom:18px;font-size:13px;line-height:1.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{background:#2a2f3a;color:var(--tx);border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.ev{border-top:1px solid var(--line);padding:10px 0}
.ev:first-child{border-top:0}
.r1{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.host{direction:ltr;text-align:left;word-break:break-all}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.accel{background:#14532d;color:#86efac}.pass{background:#3b3a14;color:#fde68a}.tunnel{background:#2a2f3a;color:var(--mut)}
.bar{height:8px;background:#0f1115;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--ac);width:0}
.mut{color:var(--mut);font-size:12px;direction:ltr;text-align:left}
.warn{color:var(--warn);font-size:13px;margin-top:6px}
.err{color:var(--err)}
</style>
</head>
<body>
<main>
<h1>⚡ ParDL</h1>
<div class="sub">همه دانلودهای سیستم از این پراکسی رد می‌شوند. هر دانلود بزرگِ HTTP که سرور Range بدهد، خودکار تکه‌تکه و موازی گرفته می‌شود. فقط کافیست دانلود را در برنامه‌ی خودت (مثلاً لانچر وار تاندر) شروع کنی.</div>

<div class="card">
  <div class="top">
    <div><b id="status">…</b><div class="mut" id="addr"></div></div>
    <button id="stop">توقف و بازگردانی تنظیمات پراکسی</button>
  </div>
  <div class="warn" id="note"></div>
</div>

<div class="card" id="list"><div class="mut" style="text-align:center">هنوز ترافیکی دیده نشده. دانلود را شروع کن…</div></div>
</main>
<script>
const TOKEN="__TOKEN__";
const $=id=>document.getElementById(id);
const api=(p,o={})=>fetch(p,{...o,headers:{"X-Token":TOKEN}}).then(r=>r.json());
const fmtB=n=>{if(n<1024)return n.toFixed(0)+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";if(n<1073741824)return (n/1048576).toFixed(1)+" MB";return (n/1073741824).toFixed(2)+" GB"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kinds={accel:["⚡ شتاب‌گرفته","accel"],pass:["HTTP عادی","pass"],tunnel:["HTTPS (تونل، قابل شتاب نیست)","tunnel"]};
$("stop").onclick=async()=>{await api("/api/stop",{method:"POST"});document.body.innerHTML="<main><h1>متوقف شد ✔</h1><p>تنظیمات پراکسی ویندوز به حالت قبل برگشت. این صفحه را ببند.</p></main>"};
async function poll(){
  try{
    const s=await api("/api/events");
    $("status").textContent="فعال — تنظیم خودکار تعداد اتصال (حداکثر "+s.max+")، فایل‌های بزرگ‌تر از "+s.minMB+" MB";
    $("addr").textContent="proxy "+s.addr+(s.sysProxy?"  (روی پراکسی ویندوز ثبت شده)":"  (پراکسی ویندوز ثبت نشده)");
    $("note").textContent=s.note||"";
    if(s.events.length){
      $("list").innerHTML=s.events.map(e=>{
        const k=kinds[e.kind]||[e.kind,"tunnel"];
        let mid="";
        if(e.kind==="accel"){
          const pct=e.size>0?e.done/e.size*100:0;
          mid=`<div class="bar"><div style="width:${pct}%"></div></div>
          <div class="mut">${fmtB(e.done)} / ${fmtB(e.size)} (${pct.toFixed(1)}%) ${e.state==="running"?" — "+fmtB(e.speed)+"/s":""} ${e.state==="done"?"✅":""} <span class="err">${esc(e.note||"")}</span></div>
          <div class="mut">اتصال: ${e.conns||1} • تکه: ${((e.chunkKB||1024)/1024).toFixed(2)}MB • ${e.mode==="ramp"?"در حال یافتن بهترین تعداد":"تنظیم لحظه‌ای"}</div>`;
        }else{
          mid=`<div class="mut">${e.done} اتصال — ${fmtB(e.size)}</div>`;
        }
        return `<div class="ev"><div class="r1"><span class="host">${esc(e.host)}${esc(e.path||"")}</span><span class="tag ${k[1]}">${k[0]}</span></div>${mid}</div>`;
      }).join("");
    }
  }catch(e){$("status").textContent="ارتباط با برنامه قطع شد (بسته شده؟)"}
  setTimeout(poll,700);
}
poll();
</script>
</body>
</html>
